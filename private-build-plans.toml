[buildPlans.afio]
family = "afio"
spacing = "term"
serifs = "sans"
noCvSs = false
exportGlyphNames = true

  [buildPlans.afio.variants]
  inherits = "ss15"

    [buildPlans.afio.variants.design]
    six = "straight-bar"
    seven = "straight-serifless"
    nine = "straight-bar"
    zero = "tall-slashed"
    capital-d = "standard-serifless"
    capital-g = "toothed-inward-serifed-hookless"
    capital-j = "serifed-both-sides"
    capital-m = "flat-bottom-serifless"
    capital-q = "crossing-baseline"
    capital-r = "straight-serifless"
    capital-u = "toothed-serifless"
    capital-w = "straight-flat-top-serifless"
    a = "double-storey-serifless"
    g = "single-storey-flat-hook-earless-rounded"
    r = "narrow-hook-serifed"
    t = "bent-hook-short-neck2"
    capital-lambda = "straight-top-serifed"
    lower-lambda = "curly-tailed-turn"
    lower-xi = "flat-top"
    lower-pi = "diagonal-tailed"
    asterisk = "penta-low"
    brace = "straight"
    number-sign = "slanted"
    ampersand = "closed"
    at = "fourfold"
    dollar = "through-cap"
    percent = "rings-continuous-slash"
    question = "smooth"
    pilcrow = "high"
    lig-ltgteq = "slanted"
    lig-double-arrow-bar = "without-notch"

    [buildPlans.afio.variants.italic]
    six = "straight-bar"
    seven = "straight-serifless"
    nine = "straight-bar"
    zero = "tall-slashed"
    capital-d = "standard-serifless"
    capital-g = "toothed-inward-serifed-hookless"
    capital-j = "serifed"
    capital-m = "flat-bottom-serifless"
    capital-q = "crossing"
    capital-r = "straight-top-left-and-bottom-right-serifed"
    capital-u = "toothed-serifless"
    capital-w = "straight-flat-top-motion-serifed"
    capital-x = "straight-serifless"
    capital-z = "straight-serifless"
    a = "double-storey-serifed"
    f = "tailed"
    g = "double-storey-open"
    i = "tailed-serifed"
    j = "serifed"
    l = "serifed-flat-tailed"
    m = "top-left-and-bottom-right-serifed"
    n = "straight-motion-serifed"
    p = "eared-motion-serifed"
    q = "top-cut-tailed-serifless"
    r = "narrow-hook-serifed"
    t = "bent-hook-short-neck2"
    v = "straight-motion-serifed"
    w = "straight-flat-top-motion-serifed"
    x = "straight-unilateral-motion-serifed"
    y = "straight-motion-serifed"
    z = "straight-serifless"
    capital-lambda = "straight-top-serifed"
    lower-lambda = "curly-tailed-turn"
    lower-xi = "flat-top"
    lower-pi = "diagonal-tailed"
    asterisk = "penta-low"
    brace = "straight"
    number-sign = "slanted"
    ampersand = "closed"
    at = "fourfold"
    dollar = "through-cap"
    percent = "rings-continuous-slash"
    question = "smooth"
    pilcrow = "high"
    lig-ltgteq = "slanted"
    lig-double-arrow-bar = "without-notch"

[buildPlans.afio.widths.Condensed]
shape = 456
menu = 3
css = "condensed"

[buildPlans.afio.widths.Normal]
shape = 600
menu = 5
css = "normal"

[buildPlans.afio.widths.SemiCondensed]
shape = 548
menu = 4
css = "semi-condensed"

[buildPlans.afio.widths.SemiExtended]
shape = 658
menu = 6
css = "semi-expanded"

[buildPlans.afio.widths.Extended]
shape = 720
menu = 7
css = "expanded"

[buildPlans.afio.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.afio.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"